name: Refresh Workout Catalog Summary

on:
  schedule:
    - cron: '23 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-workout-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Generate compact summary from upstream catalog
        run: python generate_workout_catalog_summary.py

      - name: Commit updated summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workout_catalog_summary.json
          if git diff --cached --quiet; then
            echo "Catalog summary has not changed"
          else
            git commit -m "Refresh workout catalog summary [skip ci]"
            git push
          fi
